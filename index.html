<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave of Absence Laws - Search & Compare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #222;
        }

        header p {
            font-size: 1.1em;
            color: #666;
        }

        .search-filters {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .filter-row {
                grid-template-columns: 1fr;
            }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .filter-group input,
        .filter-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
            color: #333;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #666;
            box-shadow: 0 0 0 3px rgba(102, 102, 102, 0.1);
        }

        .button-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-search {
            background: #333;
            color: white;
        }

        .btn-search:hover {
            background: #555;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-reset {
            background: #e8e8e8;
            color: #333;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
        }

        .law-card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            cursor: pointer;
            border-left: 4px solid #666;
        }

        .law-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            border-left-color: #333;
        }

        .law-card h3 {
            color: #222;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .law-card .jurisdiction {
            font-size: 0.9em;
            color: #777;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .law-card .abbreviation {
            display: inline-block;
            background: #f0f0f0;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 15px;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        .law-card p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .leave-types {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .leave-type-tag {
            display: inline-block;
            background: #f9f9f9;
            color: #333;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin: 5px 5px 5px 0;
            font-weight: 500;
            border: 1px solid #ddd;
        }

        .paid-badge {
            background: #f0f8f0;
            color: #2d5a2d;
            border-color: #b0d0b0;
        }

        .unpaid-badge {
            background: #fef5f0;
            color: #5a3d2d;
            border-color: #d0b0a0;
        }

        .official-link {
            display: inline-block;
            margin-top: 15px;
            color: #333;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            transition: all 0.3s;
        }

        .official-link:hover {
            color: #555;
            border-bottom-color: #999;
        }

        .no-results {
            text-align: center;
            color: #666;
            font-size: 1.2em;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            color: #666;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stats strong {
            color: #333;
            font-size: 1.2em;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 40px;
            padding: 20px;
        }

        footer a {
            color: #333;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 Leave of Absence Laws</h1>
            <p>Search and compare leave of absence laws across US Federal and State regulations</p>
        </header>

        <div class="search-filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="stateFilter">State / Jurisdiction</label>
                    <select id="stateFilter">
                        <option value="">All States & Federal</option>
                        <option value="US-FEDERAL">Federal Laws</option>
                        <option value="US-CA">California</option>
                        <option value="US-NY">New York</option>
                        <option value="US-TX">Texas</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="leaveTypeFilter">Type of Leave</label>
                    <select id="leaveTypeFilter">
                        <option value="">All Types</option>
                        <option value="sick">Sick Leave</option>
                        <option value="parental">Parental Leave</option>
                        <option value="bereavement">Bereavement Leave</option>
                        <option value="medical">Medical Leave</option>
                        <option value="military">Military Leave</option>
                        <option value="jury_duty">Jury Duty</option>
                        <option value="voting">Voting Leave</option>
                        <option value="domestic_violence">Domestic Violence Leave</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="searchInput">Search by Keyword</label>
                    <input type="text" id="searchInput" placeholder="e.g., 'paid leave', 'FMLA'...">
                </div>
            </div>

            <div class="button-row">
                <button class="btn-reset" onclick="resetFilters()">Reset Filters</button>
                <button class="btn-search" onclick="searchLaws()">Search</button>
            </div>
        </div>

        <div class="stats">
            Showing <strong id="resultCount">0</strong> laws
        </div>

        <div id="results" class="results"></div>

        <div id="noResults" class="no-results" style="display: none;">
            No laws found matching your search. Try adjusting your filters.
        </div>
    </div>

    <footer>
        <p>📚 <a href="https://github.com/Twebb2590/Leave-of-Absence-Law-Finder" target="_blank">View on GitHub</a> | 
        ⚖️ For informational purposes only - consult an attorney for legal advice</p>
    </footer>

    <script>
        let allLaws = [];

        // Load data from JSON files
        async function loadData() {
            try {
                const responses = await Promise.all([
                    fetch('./federal/laws.json'),
                    fetch('./states/CA/laws.json'),
                    fetch('./states/NY/laws.json'),
                    fetch('./states/TX/laws.json')
                ]);

                const data = await Promise.all(responses.map(r => r.json()));
                
                // Combine all laws
                allLaws = [];
                data.forEach(jurisdiction => {
                    jurisdiction.laws.forEach(law => {
                        allLaws.push({
                            ...law,
                            jurisdiction: jurisdiction.jurisdiction,
                            jurisdiction_name: jurisdiction.jurisdiction_name
                        });
                    });
                });

                console.log(`Loaded ${allLaws.length} laws`);
                searchLaws(); // Display all laws initially
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('results').innerHTML = 
                    '<div class="no-results">Error loading data. Please refresh the page.</div>';
            }
        }

        function searchLaws() {
            const state = document.getElementById('stateFilter').value;
            const leaveType = document.getElementById('leaveTypeFilter').value;
            const keyword = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allLaws.filter(law => {
                // Filter by state
                if (state && law.jurisdiction !== state) return false;

                // Filter by leave type
                if (leaveType) {
                    const hasLeaveType = law.leave_types.some(lt => lt.type === leaveType);
                    if (!hasLeaveType) return false;
                }

                // Filter by keyword
                if (keyword) {
                    const searchableText = (
                        law.name + ' ' +
                        law.abbreviation + ' ' +
                        law.description + ' ' +
                        law.statute_code + ' ' +
                        law.notes
                    ).toLowerCase();
                    if (!searchableText.includes(keyword)) return false;
                }

                return true;
            });

            displayResults(filtered);
        }

        function displayResults(laws) {
            const resultsDiv = document.getElementById('results');
            const noResultsDiv = document.getElementById('noResults');
            const resultCount = document.getElementById('resultCount');

            resultCount.textContent = laws.length;

            if (laws.length === 0) {
                resultsDiv.innerHTML = '';
                noResultsDiv.style.display = 'block';
                return;
            }

            noResultsDiv.style.display = 'none';
            resultsDiv.innerHTML = laws.map(law => `
                <div class="law-card">
                    <div class="jurisdiction">${law.jurisdiction_name}</div>
                    <h3>${law.name}</h3>
                    ${law.abbreviation ? `<span class="abbreviation">${law.abbreviation}</span>` : ''}
                    <p>${law.description}</p>
                    
                    <div class="leave-types">
                        <strong>Leave Types:</strong><br>
                        ${law.leave_types.map(lt => `
                            <span class="leave-type-tag ${lt.paid ? 'paid-badge' : 'unpaid-badge'}">
                                ${lt.type.replace(/_/g, ' ')} 
                                ${lt.paid !== null ? (lt.paid ? '(Paid)' : '(Unpaid)') : ''}
                                ${lt.duration && lt.duration.value ? ` - ${lt.duration.value} ${lt.duration.unit}` : ''}
                            </span>
                        `).join('')}
                    </div>

                    ${law.official_url ? `
                        <a href="${law.official_url}" target="_blank" class="official-link">
                            📖 Official Source
                        </a>
                    ` : ''}
                    
                    <p style="margin-top: 15px; font-size: 0.85em; color: #999;">
                        <strong>Statute:</strong> ${law.statute_code}
                    </p>
                </div>
            `).join('');
        }

        function resetFilters() {
            document.getElementById('stateFilter').value = '';
            document.getElementById('leaveTypeFilter').value = '';
            document.getElementById('searchInput').value = '';
            searchLaws();
        }

        // Trigger search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchLaws();
        });

        // Load data when page loads
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
