<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave of Absence Law Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<script>
  const navToggle = document.getElementById("navToggle");
  const navMenu = document.getElementById("navMenu");

  navToggle.addEventListener("click", () => {
    navMenu.classList.toggle("active");
  });
</script>

<body>

  <header class="header">
    <h1>Leave of Absence Law Finder</h1>
    <p class="subtitle">Find federal and state leave laws based on your situation</p>
    <nav class="navbar">
  <div class="nav-brand">Home</div>

  <button class="nav-toggle" id="navToggle">
    ☰
  </button>

  <ul class="nav-menu" id="navMenu">
    <li><a href="index.html">Home</a></li>
    <li><a href="compare.html">Compare</a></li>
    <li><a href="search.html">Search</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>
  </header>

  <main class="container">

    <!-- Wizard -->
    <section id="wizardContainer">
      <div id="chatContainer"></div>
      <div id="quickReplyContainer"></div>
    </section>

    <!-- Search -->
    <section id="searchSection">
      <input id="searchInput" type="text" placeholder="Search leave laws...">
      <button id="searchBtn">Search</button>
    </section>

    <!-- Filter Panel -->
    <section id="filterPanelContainer"></section>

    <!-- Active Filters Summary -->
    <section id="currentFiltersSummary"></section>

    <!-- Filter Buttons -->
    <section id="filterButtons">
      <button id="clearAllFiltersBtn">Clear Filters</button>
      <button id="compareStatesBtn">Compare States</button>
      <input id="userInput" />
<button id="sendBtn">Send</button>

    </section>

    <!-- Results -->
    <section id="resultsArea">
      <h2>Results</h2>
      <div id="resultsCount"></div>
      <div id="resultsContainer"></div>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 Leave of Absence Law Finder</p>
  </footer>

  <!-- Scripts -->
  <script type="module" src="data-loader.js"></script>
  <script type="module" src="wizard.js"></script>
  <script type="module" src="script.js"></script>

</body>
</html>
