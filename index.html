<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave of Absence Law Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header">
    <h1>Leave of Absence Law Finder</h1>
    <p class="subtitle">Find federal and state leave laws based on your situation</p>

  <body class="wizard-page">   
 
   <nav class="navbar">
    <div class="nav-left">
        <a href="dashboard.html" class="logo">Leave Portal</a>
    </div>

    <button id="navToggle" class="nav-toggle">☰</button>

    <ul id="navMenu" class="nav-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="search.html">Search</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>
</nav>

  </header>

  <main class="container">

    <!-- Wizard -->
    <section id="wizardContainer">
      <div id="chatContainer"></div>
      <div id="quickRepliesContainer"></div>
      <div id="wizardInputArea" class="wizard-input-area">
      <div class="input-row">
        <input id="userInput" type="text" placeholder="Type your answer…">
        <button id="sendBtn">Send</button>
        <button id="startOverBtn" class="start-over-btn" title="Start over">
  <!-- SVG -->
  <svg viewBox="0 0 24 24" width="36" height="36">
    <path d="M21 12a9 9 0 1 1-3-6.7" 
          fill="#f5f7fa" 
          stroke="#0078ff" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <polyline points="21 3 21 9 15 9" 
              fill="#f5f7fa" 
              stroke="#0078ff" 
              stroke-width="2" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
  </svg>
</button>
 </div>
        
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 Leave of Absence Law Finder</p>
  </footer>

  <!-- Scripts -->
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const navToggle = document.getElementById("navToggle");
    const navMenu = document.getElementById("navMenu");

    if (navToggle && navMenu) {
        navToggle.addEventListener("click", () => {
            navMenu.classList.toggle("active");
        });
    }
});
</script>

  <script type="module" src="data-loader.js"></script>
  <script type="module" src="wizard.js"></script>
  <script type="module" src="script.js"></script>
  <script>
  const authLink = document.getElementById("authLink");
  const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

  if (loggedInUser) {
    // User is logged in → show Logout
    authLink.textContent = "Logout";
    authLink.href = "#";

    authLink.addEventListener("click", () => {
      localStorage.removeItem("loggedInUser");
      alert("You have been logged out.");
      window.location.href = "login.html";
    });

  } else {
    // User is not logged in → show Login
    authLink.textContent = "Login";
    authLink.href = "login.html";
  }
</script>

</body>
</html>
