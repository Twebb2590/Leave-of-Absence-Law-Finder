<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Leave Laws</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header">
    <h1>Search Leave Laws</h1>
   
    <nav class="navbar">
    <div class="nav-container">
        <a href="dashboard.html" class="nav-logo">Search</a>

        <button id="navToggle" class="nav-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul id="navMenu" class="nav-menu">
            <li><a href="about.html">About</a></li>
            <li><a href="search.html">Search</a></li>
            <li><a href="compare.html">Compare</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>
</nav>
  </header>

  <main class="container">

    <section id="searchSection">
      <input id="searchInput" type="text" placeholder="Search leave laws...">
      <button id="searchBtn">Search</button>
    </section>

    <section id="filterPanelContainer">
  <div id="filtersAppliedBadge" class="filters-badge hidden">
    Filters applied: <span id="filtersAppliedCount">0</span>
  </div>
</section>

<section id="currentFiltersSummary"></section>

<section id="filterButtons" class="filter-row">
  <button id="clearAllFiltersBtn">Clear Filters</button>
</section>

    <section id="resultsArea">
      <h2>Results</h2>
      <div id="resultsCount"></div>
      <div id="resultsContainer"></div>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 Leave of Absence Law Finder</p>
  </footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const navToggle = document.getElementById("navToggle");
  const navMenu = document.getElementById("navMenu");

  if (navToggle && navMenu) {
    navToggle.addEventListener("click", () => {
      navMenu.classList.toggle("active");
    });
  }
});
</script>
  
  <script type="module" src="data-loader.js"></script>
  <script type="module" src="script.js"></script>
<script>
  const authLink = document.getElementById("authLink");
  const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

  if (loggedInUser) {
    // User is logged in → show Logout
    authLink.textContent = "Logout";
    authLink.href = "#";

    authLink.addEventListener("click", () => {
      localStorage.removeItem("loggedInUser");
      alert("You have been logged out.");
      window.location.href = "login.html";
    });

  } else {
    // User is not logged in → show Login
    authLink.textContent = "Login";
    authLink.href = "login.html";
  }
</script>

</body>
</html>
