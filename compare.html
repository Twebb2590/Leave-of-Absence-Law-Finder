<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare State Leave Laws</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header">
    <h1>Compare State Leave Laws</h1>
    <p class="subtitle">Select two states to compare their leave protections</p>
    <nav class="navbar">
  <div class="nav-brand">Home</div>

  <button class="nav-toggle" id="navToggle">
    ☰
  </button>

  <ul class="nav-menu" id="navMenu">
    <li><a href="index.html">Chat</a></li>
    <li><a href="compare.html">Compare</a></li>
    <li><a href="search.html">Search</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>
  </header>

  <main class="container">

    <section id="compareControls">
      <label for="stateA">State A:</label>
      <select id="stateA"></select>

      <label for="stateB">State B:</label>
      <select id="stateB"></select>

      <button id="compareBtn">Compare</button>
    </section>

    <section id="comparisonResults">
      <h2>Comparison Results</h2>
      <div id="comparisonOutput"></div>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 Leave of Absence Law Finder</p>
  </footer>

  <!-- Load your existing data + logic -->
  <script type="module" src="data-loader.js"></script>
  <script type="module">
    import { states } from './data-loader.js';

const stateASelect = document.getElementById("stateA");
const stateBSelect = document.getElementById("stateB");
const output = document.getElementById("comparisonOutput");

// Populate dropdowns
Object.keys(states).forEach(state => {
  stateASelect.innerHTML += `<option value="${state}">${state}</option>`;
  stateBSelect.innerHTML += `<option value="${state}">${state}</option>`;
});

function formatValue(value) {
  if (value === true) return `<span class="yes">✔ Yes</span>`;
  if (value === false) return `<span class="no">✘ No</span>`;
  return value;
}

document.getElementById("compareBtn").addEventListener("click", () => {
  const a = stateASelect.value;
  const b = stateBSelect.value;

  if (!a || !b) {
    output.innerHTML = "<p>Please select two states.</p>";
    return;
  }

  const lawsA = states[a];
  const lawsB = states[b];

  // Build comparison rows dynamically
  const categories = Object.keys(lawsA);

  const cardA = categories.map(cat => `
    <div class="compare-row">
      <div class="compare-label">${cat}</div>
      <div class="compare-value">${formatValue(lawsA[cat])}</div>
    </div>
  `).join("");

  const cardB = categories.map(cat => `
    <div class="compare-row">
      <div class="compare-label">${cat}</div>
      <div class="compare-value">${formatValue(lawsB[cat])}</div>
    </div>
  `).join("");

  output.innerHTML = `
    <div class="comparison-grid">
      <div class="compare-card">
        <h3>${a}</h3>
        ${cardA}
      </div>

      <div class="compare-card">
        <h3>${b}</h3>
        ${cardB}
      </div>
    </div>
  `;
});

  </script>

  <!-- Sidebar JS -->
  <script>
    const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");
    const overlay = document.getElementById("overlay");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("show");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    });
  </script>

</body>
</html>
