<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare State Leave Laws</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Slide-In Sidebar Menu -->
  <div id="sidebar">
    <h2>Menu</h2>
    <a href="index.html">Chat</a>
    <a href="search.html">Search</a>
    <a href="compare.html">Compare States</a>
    <a href="about.html">About</a>
  </div>

  <button id="menuBtn" class="menu-btn">☰</button>
  <div id="overlay"></div>

  <header class="header">
    <h1>Compare State Leave Laws</h1>
    <p class="subtitle">Select two states to compare their leave protections</p>
  </header>

  <main class="container">

    <section id="compareControls">
      <label for="stateA">State A:</label>
      <select id="stateA"></select>

      <label for="stateB">State B:</label>
      <select id="stateB"></select>

      <button id="compareBtn">Compare</button>
    </section>

    <section id="comparisonResults">
      <h2>Comparison Results</h2>
      <div id="comparisonOutput"></div>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 Leave of Absence Law Finder</p>
  </footer>

  <!-- Load your existing data + logic -->
  <script type="module" src="data-loader.js"></script>
  <script type="module">
    import { leaveData } from './data-loader.js';

    const stateASelect = document.getElementById("stateA");
    const stateBSelect = document.getElementById("stateB");
    const output = document.getElementById("comparisonOutput");

    // Populate dropdowns
    Object.keys(leaveData.states).forEach(state => {
      const optA = document.createElement("option");
      optA.value = state;
      optA.textContent = state;

      const optB = document.createElement("option");
      optB.value = state;
      optB.textContent = state;

      stateASelect.appendChild(optA);
      stateBSelect.appendChild(optB);
    });

    document.getElementById("compareBtn").addEventListener("click", () => {
      const a = stateASelect.value;
      const b = stateBSelect.value;

      if (!a || !b) {
        output.innerHTML = "<p>Please select two states.</p>";
        return;
      }

      const lawsA = leaveData.states[a];
      const lawsB = leaveData.states[b];

      output.innerHTML = `
        <h3>${a} vs ${b}</h3>
        <div class="comparison-grid">
          <div>
            <h4>${a}</h4>
            <pre>${JSON.stringify(lawsA, null, 2)}</pre>
          </div>
          <div>
            <h4>${b}</h4>
            <pre>${JSON.stringify(lawsB, null, 2)}</pre>
          </div>
        </div>
      `;
    });
  </script>

  <!-- Sidebar JS -->
  <script>
    const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");
    const overlay = document.getElementById("overlay");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("show");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    });
  </script>

</body>
</html>
