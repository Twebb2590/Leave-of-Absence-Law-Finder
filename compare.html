<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare State Leave Laws</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header">
    <h1>Compare State Leave Laws</h1>
    <p class="subtitle">Select two states to compare their leave protections</p>
     <nav class="navbar">
    <div class="nav-container">
        <a href="compare.html" class="nav-logo">Compare</a>

        <button id="navToggle" class="nav-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul id="navMenu" class="nav-menu">
            <li><a href="about.html">About</a></li>
          <li><a href="search.html">Search</a></li>
            <li><a href="index.html">Chat</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>
</nav>
  </header>

  <main class="container">

    <section id="compareControls">
      <label for="stateA">State A:</label>
      <select id="stateA" data-state-dropdown></select>


      <label for="stateB">State B:</label>
      <select id="stateB"></select>

      <button id="compareBtn">Compare</button>
    </section>

    <section id="comparisonResults">
      <h2>Comparison Results</h2>
      <div id="comparisonOutput"></div>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 Leave of Absence Law Finder</p>
  </footer>

  <script>
document.addEventListener("DOMContentLoaded", () => {
    const navToggle = document.getElementById("navToggle");
    const navMenu = document.getElementById("navMenu");

    if (navToggle && navMenu) {
        navToggle.addEventListener("click", () => {
            navMenu.classList.toggle("active");
        });
    }
});
</script>
 
  <!-- Load your existing data + logic -->
  <script type="module" src="data-loader.js"></script>
  <script type="module">
    import { states } from './states/state-list.js';

const stateASelect = document.getElementById("stateA");
const stateBSelect = document.getElementById("stateB");
const output = document.getElementById("comparisonOutput");

async function loadStateLaws(code) {
  const response = await fetch(`./states/${code}/laws.json`);
  return await response.json();
}
    
// Populate dropdowns with state names
states.forEach(state => {
  stateASelect.innerHTML += `<option value="${state.code}">${state.name}</option>`;
  stateBSelect.innerHTML += `<option value="${state.code}">${state.name}</option>`;
});


ffunction formatValue(value) {
  if (value === true) return `<span class="yes">✔ Yes</span>`;
  if (value === false) return `<span class="no">✘ No</span>`;

  // If it's an object, pretty-print it
  if (typeof value === "object" && value !== null) {
    return Object.entries(value)
      .map(([key, val]) => `<div><strong>${key}:</strong> ${val}</div>`)
      .join("");
  }

  return value;
}


document.getElementById("compareBtn").addEventListener("click", async () => {
  const a = stateASelect.value;
  const b = stateBSelect.value;

  if (!a || !b) {
    output.innerHTML = "<p>Please select two states.</p>";
    return;
  }

  // Load laws from your folders
  const lawsA = await loadStateLaws(a);
  const lawsB = await loadStateLaws(b);

  const stateAData = states.find(s => s.code === a);
  const stateBData = states.find(s => s.code === b);

  const categories = Object.keys(lawsA);

  const cardA = categories.map(cat => `
    <div class="compare-row">
      <div class="compare-label">${cat}</div>
      <div class="compare-value">${formatValue(lawsA[cat])}</div>
    </div>
  `).join("");

  const cardB = categories.map(cat => `
    <div class="compare-row">
      <div class="compare-label">${cat}</div>
      <div class="compare-value">${formatValue(lawsB[cat])}</div>
    </div>
  `).join("");

  output.innerHTML = `
    <div class="comparison-grid">
      <div class="compare-card">
        <h3>${stateAData.name}</h3>
        ${cardA}
      </div>

      <div class="compare-card">
        <h3>${stateBData.name}</h3>
        ${cardB}
      </div>
    </div>
  `;
});



  </script>


</body>
</html>
