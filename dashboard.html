<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>

  <body>
    <header class="header">
      <h1>Dashboard</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="login.html" id="authLink" class="login-link">Login</a>
      </nav>
    </header>

    <main class="container">
      <h2 id="welcome"></h2>
    </main>

<div id="profileSummary" class="profile-summary"></div>


    
    <!-- Floating Chat Button -->
    <div id="chatButton" class="chat-button">💬</div>

    <!-- Chat Popup -->
    <div id="chatPopup" class="chat-popup" style="display:none;">
      <div class="chat-header">
        <span>Leave Assistant</span>
        <div style="display:flex; gap:10px;">
        <button id="resetChat" class="reset-chat">↺</button>
        <button id="closeChat" class="close-chat">×</button>
      </div>
  </div>

      <!-- CHAT WINDOW -->
      <div id="chatWindow" class="chat-window"></div>
<div id="typingIndicator" class="typing-indicator" style="display:none;">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
</div>

<div id="suggestions" class="suggestions"></div>

      
      <!-- INPUT ROW -->
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Type your question…" />
        <button id="chatSend" class="chat-send">Send</button>
      </div>
    </div>

    <!-- LOGIN / LOGOUT LOGIC -->
    <script>
      const user = JSON.parse(localStorage.getItem("loggedInUser"));

      if (!user) {
        window.location.href = "login.html";
      } else {
        document.getElementById("welcome").textContent =
          "Welcome, " + user.name;
      }

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("loggedInUser");
        window.location.href = "login.html";
      });

      const authLink = document.getElementById("authLink");
      const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

      if (loggedInUser) {
        authLink.textContent = "Logout";
        authLink.href = "#";

        authLink.addEventListener("click", () => {
          localStorage.removeItem("loggedInUser");
          alert("You have been logged out.");
          window.location.href = "login.html";
        });
      } else {
        authLink.textContent = "Login";
        authLink.href = "login.html";
      }
    </script>

    <!-- CHAT POPUP OPEN/CLOSE -->
    <script>
      const chatButton = document.getElementById("chatButton");
      const chatPopup = document.getElementById("chatPopup");
      const closeChat = document.getElementById("closeChat");

      chatButton.addEventListener("click", () => {
        chatPopup.style.display = "flex";
      });

      closeChat.addEventListener("click", () => {
        chatPopup.style.display = "none";
      });
    </script>

    <!-- CHAT ENGINE -->
    <script type="module" src="chat-engine.js"></script>

<script>
async function loadProfileSummary() {
    const container = document.getElementById("profileSummary");
    const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

    if (!loggedInUser) {
        container.innerHTML = "<p>You are not logged in.</p>";
        return;
    }

    const email = loggedInUser.email.trim().toLowerCase();

    const res = await fetch("knowledgeBase.json");
    const kb = await res.json();

    const user = kb.private?.users?.[email];

    if (!user) {
        container.innerHTML = "<p>No profile data found.</p>";
        return;
    }

    container.innerHTML = `
        <h2>Your Leave Profile</h2>
        <table class="profile-table">
            <tr><td class="label">Name</td><td class="value">${user.name}</td></tr>
            <tr><td class="label">Leave Type</td><td class="value">${user.leave_type}</td></tr>
            <tr><td class="label">Hours Available</td><td class="value">${user.hours_available}</td></tr>
            <tr><td class="label">Hours Used</td><td class="value">${user.hours_used}</td></tr>
            <tr><td class="label">FMLA Remaining</td><td class="value">${user.fmla_remaining}</td></tr>
            <tr><td class="label">State PFML Remaining</td><td class="value">${user.state_pfml_remaining}</td></tr>
            <tr><td class="label">Case Status</td><td class="value">${user.case_status}</td></tr>
            <tr><td class="label">Next Step</td><td class="value">${user.next_step}</td></tr>
            <tr><td class="label">Case Manager</td><td class="value">${user.case_manager}</td></tr>
        </table>
    `;
}

loadProfileSummary();
</script>


    
  </body>
</html>
