<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="header">
      <h1>Dashboard</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="login.html" id="authLink" class="login-link">Login</a>
      </nav>
    </header>

    <main class="container">
      <h2 id="welcome"></h2>
      <button id="logoutBtn" class="primary-btn">Logout</button>
    </main>

    <!-- Floating Chat Button -->
    <div id="chatButton" class="chat-button">💬</div>

    <!-- Chat Popup -->
    <div id="chatPopup" class="chat-popup" style="display:none;">
      <div class="chat-header">
        <span>Leave Assistant</span>
        <button id="closeChat" class="close-chat">×</button>
      </div>

      <!-- CHAT WINDOW -->
      <div id="chatWindow" class="chat-window"></div>

      <!-- INPUT ROW -->
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Type your question…" />
        <button id="chatSend" class="chat-send">Send</button>
      </div>
    </div>

    <!-- LOGIN / LOGOUT LOGIC -->
    <script>
      const user = JSON.parse(localStorage.getItem("loggedInUser"));

      if (!user) {
        window.location.href = "login.html";
      } else {
        document.getElementById("welcome").textContent =
          "Welcome, " + user.name;
      }

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("loggedInUser");
        window.location.href = "login.html";
      });

      const authLink = document.getElementById("authLink");
      const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

      if (loggedInUser) {
        authLink.textContent = "Logout";
        authLink.href = "#";

        authLink.addEventListener("click", () => {
          localStorage.removeItem("loggedInUser");
          alert("You have been logged out.");
          window.location.href = "login.html";
        });
      } else {
        authLink.textContent = "Login";
        authLink.href = "login.html";
      }
    </script>

    <!-- CHAT POPUP OPEN/CLOSE -->
    <script>
      const chatButton = document.getElementById("chatButton");
      const chatPopup = document.getElementById("chatPopup");
      const closeChat = document.getElementById("closeChat");

      chatButton.addEventListener("click", () => {
        chatPopup.style.display = "flex";
      });

      closeChat.addEventListener("click", () => {
        chatPopup.style.display = "none";
      });
    </script>

    <!-- CHAT ENGINE -->
    <script type="module" src="chat-engine.js"></script>
  </body>
</html>
